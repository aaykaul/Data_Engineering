name: PySpark CI

on:
  push:
    branches:
      - main
      - pyspark-project

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ./PySparkApp/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall ./PySparkApp/src

      - name: Run tests
        run: pytest ./PySparkApp/tests

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/pyspark-learning:4.1 \
            ./PySparkApp

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/pyspark-learning:4.1
