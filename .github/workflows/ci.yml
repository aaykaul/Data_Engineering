name: PySpark CI

on:
  push:
    branches:
      - main
      - pyspark-project

  pull_request:
    branches:
      - main

    paths-ignore:
      - ".github/workflows/promote-qa.yml"
      - ".github/workflows/promote-prod.yml"

#    paths:
#      - "PySparkApp/src/**"
#      - "PySparkApp/tests/**"
#      - "PySparkApp/Dockerfile"
#      - "PySparkApp/requirements.txt"      

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ./PySparkApp/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall ./PySparkApp/src

      - name: Run tests
        run: pytest ./PySparkApp/tests

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/pyspark-learning:4.1 \
            ./PySparkApp

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/pyspark-learning:4.1

  deploy-test:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes connection
        run: kubectl get nodes

      - name: Deploy Pyspark Job
        run: |
          kubectl delete job pyspark-learning-v6 --ignore-not-found
          kubectl apply -f ./PySparkApp/kubernetes/pyspark-job.yaml